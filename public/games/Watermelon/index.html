<script>
(function() {
    // Debug overlay
    var debugDiv = document.createElement('div');
    debugDiv.id = 'debug-log';
    debugDiv.style.cssText = "position:fixed; top:0; left:0; width:100%; height:50%; overflow:auto; background:rgba(0,0,0,0.8); color:lime; z-index:9999; pointer-events:none; font-family:monospace; font-size:12px; display:block;";
    debugDiv.innerHTML = "<div>Debug Log Started...</div>";
    document.body.appendChild(debugDiv);

    function logToScreen(msg, color) {
        if (!debugDiv) return;
        var div = document.createElement('div');
        div.style.color = color || 'lime';
        div.textContent = '[' + new Date().toISOString().split('T')[1] + '] ' + msg;
        debugDiv.appendChild(div);
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    var originalLog = console.log;
    var originalWarn = console.warn;
    var originalError = console.error;

    console.log = function() {
        var args = Array.prototype.slice.call(arguments);
        originalLog.apply(console, args);
        logToScreen(args.join(' '), 'lime');
    };
    console.warn = function() {
        var args = Array.prototype.slice.call(arguments);
        originalWarn.apply(console, args);
        logToScreen(args.join(' '), 'yellow');
    };
    console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        logToScreen(args.join(' '), 'red');
    };

    window.onerror = function(msg, url, line, col, error) {
        logToScreen("Global Error: " + msg + " (" + url + ":" + line + ":" + col + ")", 'red');
        if (error && error.stack) logToScreen(error.stack, 'red');
    };

    window.addEventListener('unhandledrejection', function(event) {
        logToScreen("Unhandled Rejection: " + event.reason, 'red');
    });
})();
</script>
